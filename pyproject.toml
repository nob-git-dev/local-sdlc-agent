[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-sdlc-agent"
version = "0.1.0"
description = "Local OpenAI-compatible LLM coding agent with SDLC, repair loops, and a local browser UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial 1.0.0 for code; CC BY-NC-SA 4.0 for docs and prompts" }
authors = [
  { name = "nob-git-dev" }
]
dependencies = []

[project.scripts]
local-sdlc-agent = "local_sdlc.cli:main"
local-sdlc-learning = "learning_runtime.cli:main"

[tool.setuptools]
packages = ["local_sdlc", "sdlc_events", "learning_runtime"]
include-package-data = true

[tool.setuptools.package-data]
local_sdlc = ["web_assets/*.html"]
