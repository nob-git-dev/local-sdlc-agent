<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            font-family: monospace;
            color: #fff;
        }
        .game-container {
            position: relative;
            width: 300px;
            height: 600px;
            background-color: #111;
            border: 2px solid #333;
            overflow: hidden;
        }
        #game-board {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
        }
        .cell {
            width: 100%;
            height: 100%;
            background-color: #222;
            border: 1px solid #333;
        }
        .cell.filled {
            background-color: #00f;
        }
        .cell.active {
            background-color: #0ff;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .ui-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
        }
        .ui-panel div {
            margin: 5px 0;
            font-size: 18px;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay-title {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }
        #start-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 18px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #start-btn:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="game-board"></div>
        <div class="ui-panel">
            <div>Score: <span id="score">0</span></div>
            <div>Level: <span id="level">1</span></div>
            <div>Lines: <span id="lines">0</span></div>
        </div>
        <div class="overlay" id="game-over-overlay">
            <div class="overlay-title" id="overlay-title"></div>
        </div>
        <button id="start-btn">Start Game</button>
    </div>

    <script>
        const boardWidth = 10;
        const boardHeight = 20;
        let board = [];
        let currentPiece = null;
        let currentPos = { x: 0, y: 0 };
        let score = 0;
        let level = 1;
        let linesCleared = 0;
        let gameInterval = null;
        let isGameOver = false;
        let isPaused = false;

        const pieces = [
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 1, 1], [0, 0, 1]], // J
            [[1, 1, 1], [1, 0, 0]], // L
            [[1, 1, 1, 1]], // I
            [[0, 1, 1], [1, 1, 0]], // S
            [[1, 1, 0], [0, 1, 1]]  // Z
        ];

        const colors = [
            '#00f', // O - blue
            '#f0f', // T - magenta
            '#0ff', // J - cyan
            '#f00', // L - red
            '#ff0', // I - yellow
            '#0f0', // S - green
            '#f00'  // Z - red (different shade)
        ];

        function createBoard() {
            board = Array.from({ length: boardHeight }, () => Array(boardWidth).fill(0));
        }

        function drawBoard() {
            const gameBoard = document.getElementById('game-board');
            gameBoard.innerHTML = '';
            
            for (let y = 0; y < boardHeight; y++) {
                for (let x = 0; x < boardWidth; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (board[y][x] !== 0) {
                        cell.classList.add('filled');
                    }
                    gameBoard.appendChild(cell);
                }
            }
        }

        function drawPiece() {
            if (!currentPiece) return;
            const cells = document.querySelectorAll('#game-board .cell');
            currentPiece.shape.forEach((row, dy) => {
                row.forEach((value, dx) => {
                    if (value) {
                        const y = currentPos.y + dy;
                        const x = currentPos.x + dx;
                        if (y >= 0 && y < boardHeight && x >= 0 && x < boardWidth) {
                            const index = y * boardWidth + x;
                            cells[index].classList.add('active');
                        }
                    }
                });
            });
        }

        function clearPiece() {
            if (!currentPiece) return;
            const cells = document.querySelectorAll('#game-board .cell');
            currentPiece.shape.forEach((row, dy) => {
                row.forEach((value, dx) => {
                    if (value) {
                        const y = currentPos.y + dy;
                        const x = currentPos.x + dx;
                        if (y >= 0 && y < boardHeight && x >= 0 && x < boardWidth) {
                            const index = y * boardWidth + x;
                            cells[index].classList.remove('active');
                        }
                    }
                });
            });
        }

        function createNewPiece() {
            const idx = Math.floor(Math.random() * pieces.length);
            currentPiece = {
                shape: pieces[idx],
                color: colors[idx]
            };
            currentPos = { x: Math.floor((boardWidth - currentPiece.shape[0].length) / 2), y: 0 };
            
            if (!isValidPosition()) {
                gameOver();
            }
        }

        function isValidPosition(offsetX = 0, offsetY = 0) {
            if (!currentPiece) return true;
            return currentPiece.shape.every((row, dy) => {
                return row.every((value, dx) => {
                    if (value === 0) return true;
                    const newX = currentPos.x + dx + offsetX;
                    const newY = currentPos.y + dy + offsetY;
                    return newX >= 0 && newX < boardWidth && 
                           newY >= 0 && newY < boardHeight && 
                           board[newY][newX] === 0;
                });
            });
        }

        function movePiece(dx, dy) {
            clearPiece();
            if (isValidPosition(dx, dy)) {
                currentPos.x += dx;
                currentPos.y += dy;
                drawPiece();
                return true;
            }
            drawPiece();
            return false;
        }

        function rotate() {
            if (!currentPiece) return;
            clearPiece();
            const rotated = currentPiece.shape[0].map((_, i) => 
                currentPiece.shape.map(row => row[i]).reverse()
            );
            if (isValidPosition(0, 0, rotated)) {
                currentPiece.shape = rotated;
                drawPiece();
            } else {
                drawPiece();
            }
        }

        function softDrop() {
            movePiece(0, 1);
        }

        function hardDrop() {
            let dropped = 0;
            while (movePiece(0, 1)) {
                dropped++;
            }
            if (dropped > 0) {
                placePiece();
            }
        }

        function placePiece() {
            if (!currentPiece) return;
            currentPiece.shape.forEach((row, dy) => {
                row.forEach((value, dx) => {
                    if (value) {
                        const y = currentPos.y + dy;
                        const x = currentPos.x + dx;
                        if (y >= 0 && y < boardHeight && x >= 0 && x < boardWidth) {
                            board[y][x] = 1;
                        }
                    }
                });
            });
            clearPiece();
            const lines = clearLines();
            if (lines > 0) {
                updateScore(lines);
            }
            createNewPiece();
        }

        function clearLines() {
            let linesCleared = 0;
            for (let y = boardHeight - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(boardWidth).fill(0));
                    linesCleared++;
                    y++; // Check same position again
                }
            }
            return linesCleared;
        }

        function updateScore(lines) {
            linesCleared += lines;
            score += lines * 100 * level;
            level = Math.floor(linesCleared / 10) + 1;
            
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = linesCleared;
        }

        function startGame() {
            if (gameInterval) return;
            createBoard();
            drawBoard();
            createNewPiece();
            drawPiece();
            gameInterval = setInterval(gameLoop, 1000 / level);
            isGameOver = false;
            isPaused = false;
            document.getElementById('overlay-title').textContent = '';
            document.getElementById('game-over-overlay').style.display = 'none';
        }

        function gameLoop() {
            if (isGameOver || isPaused) return;
            if (!movePiece(0, 1)) {
                placePiece();
            }
        }

        function movePiece(dx) {
            return movePiece(dx, 0);
        }

        function rotate() {
            // Already defined above
        }

        function softDrop() {
            // Already defined above
        }

        function hardDrop() {
            // Already defined above
        }

        function clearLines() {
            // Already defined above
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameInterval = null;
            isGameOver = true;
            document.getElementById('overlay-title').textContent = 'GAME OVER';
            document.getElementById('game-over-overlay').style.display = 'flex';
        }

        // Event listeners
        document.getElementById('start-btn').addEventListener('click', startGame);
        
        document.addEventListener('keydown', (e) => {
            if (isGameOver) {
                if (e.key === 'Enter' || e.key === ' ') {
                    startGame();
                }
                return;
            }
            
            if (e.key === 'ArrowLeft') {
                movePiece(-1);
            } else if (e.key === 'ArrowRight') {
                movePiece(1);
            } else if (e.key === 'ArrowUp') {
                rotate();
            } else if (e.key === 'ArrowDown') {
                softDrop();
            } else if (e.key === ' ') {
                hardDrop();
            } else if (e.key === 'p' || e.key === 'P') {
                isPaused = !isPaused;
                if (isPaused) {
                    document.getElementById('overlay-title').textContent = 'PAUSED';
                    document.getElementById('game-over-overlay').style.display = 'flex';
                } else {
                    document.getElementById('overlay-title').textContent = '';
                    document.getElementById('game-over-overlay').style.display = 'none';
                }
            }
        });

        // Expose required functions to window
        window.startGame = startGame;
        window.gameLoop = gameLoop;
        window.movePiece = movePiece;
        window.rotate = rotate;
        window.softDrop = softDrop;
        window.hardDrop = hardDrop;
        window.clearLines = clearLines;
        window.gameOver = gameOver;
    </script>
</body>
</html>
